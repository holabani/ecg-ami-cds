# CardioSense — nginx on EC2 (TLS via Let’s Encrypt)
#
# Assumes Docker Compose binds:
#   Next.js → 127.0.0.1:3000
#   FastAPI → 127.0.0.1:8000
#   Grafana → 127.0.0.1:3010
#   Prometheus → 127.0.0.1:9090 (optional public hostnames below — keep auth/restrict!)
#
# 1) Replace the three server_name lines with YOUR DNS records (DNS A records → EC2 public IP or Elastic IP).
# 2) sudo cp deploy/nginx/cardiosense-ec2.conf /etc/nginx/sites-available/cardiosense
#    sudo ln -sf /etc/nginx/sites-available/cardiosense /etc/nginx/sites-enabled/
#    sudo rm -f /etc/nginx/sites-enabled/default
#    sudo nginx -t && sudo systemctl reload nginx
# 3) Ubuntu: sudo apt install -y certbot python3-certbot-nginx
#    sudo certbot --nginx \
#      -d app.EXAMPLE.COM -d api.EXAMPLE.COM -d grafana.EXAMPLE.COM
#    # Add -d prometheus.EXAMPLE.COM only if you enable that server block and accept the risk.
# 4) Repo root .env: NEXT_PUBLIC_API_URL=https://api.EXAMPLE.COM  (then rebuild frontend)
#    Grafana: GRAFANA_SERVER_ROOT_URL=https://grafana.EXAMPLE.COM/
# 5) AWS security group: allow 80 + 443 from the internet; remove public 3000/8000/22 when happy.

upstream cardiosense_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream cardiosense_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream cardiosense_grafana {
    server 127.0.0.1:3010;
    keepalive 16;
}

upstream cardiosense_prometheus {
    server 127.0.0.1:9090;
    keepalive 16;
}

# ── Next.js (users) ─────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name app.EXAMPLE.COM;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_pass http://cardiosense_frontend;
    }
}

# ── FastAPI (JWT, /predict, /metrics scraped by Prometheus on Docker network — not via this proxy) ─
server {
    listen 80;
    listen [::]:80;
    server_name api.EXAMPLE.COM;

    client_max_body_size 50M;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_pass http://cardiosense_backend;
    }
}

# ── Grafana dashboards ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name grafana.EXAMPLE.COM;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_pass http://cardiosense_grafana;
    }
}

