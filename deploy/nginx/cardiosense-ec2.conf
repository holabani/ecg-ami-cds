# CardioSense — Nginx reverse proxy (place in /etc/nginx/sites-available/ on the EC2 host).
#
# Prereqs:
#   - Frontend container: 127.0.0.1:3000
#   - Backend container: 127.0.0.1:8000  (adjust if you bound backend to localhost only)
#
# If Compose still publishes 0.0.0.0:8000, you can omit API server block and expose :8000 directly
# in the security group instead — this file is optional for the “single domain” UX.
#
# Enable: sudo ln -s /etc/nginx/sites-available/cardiosense-ec2.conf /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
# SSL:    sudo certbot --nginx -d your.domain.com

# ── Frontend (recommended: one public hostname for the Next.js app only) ──
server {
    listen 80;
    server_name your-frontend-domain.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Optional: same host for API (only if you also point DNS here and match NEXT_PUBLIC_API_URL) ──
# Backend routes live at TOP LEVEL (/predict, /auth/...) — do NOT prefix with /api in FastAPI today.
