# CardioSense — Prometheus scrape configuration
#
# Key metrics exposed by POST /predict + HTTP middleware include:
#   ecg_ami_confusion_vs_ground_truth_total{outcome="tp|tn|fp|fn"}  — when ami_ground_truth is sent
#
# Usage (local Docker Compose):
#   1. Add a Prometheus service mounting this file (example below).
#   2. Set `targets` host to the backend service name & port exposed on the Compose network,
#      e.g. `backend:8000` instead of localhost.
#
# Minimal compose snippet:
#
#   services:
#     prometheus:
#       image: prom/prometheus:v2.54.1
#       volumes:
#         - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
#       ports:
#         - "9090:9090"
#
# Grafana can use Prometheus URL http://prometheus:9090 as data source.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # FastAPI exposes OpenMetrics-compatible text at GET /metrics
  - job_name: cardiSense-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:8000
