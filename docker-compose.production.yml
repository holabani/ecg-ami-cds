# CardioSense — single-host EC2 deployment (docker compose -f docker-compose.production.yml up -d --build)
#
# Before first build, set in .env next to this file (or export):
#   NEXT_PUBLIC_API_URL=http://YOUR_EC2_PUBLIC_DNS:8000
#   Or https://api.yourdomain.com  (must match what the browser will use to reach FastAPI)
#
# Prereqs: copy backend/.env from backend/.env.production.example (secrets, JWT, SMTP, DB path).
#
# Persistence: ./data/backend (SQLite), prometheus_tsdb (Prometheus WAL)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Public API — restrict with EC2 SG + optional nginx later; or use "127.0.0.1:8000:8000" + reverse proxy only
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      # SQLite + any runtime files — survives container recreate (not image rebuild without mount)
      - cardiosense-backend-data:/data
    # Default DB path is sqlite:///./cardiosense.db relative to CWD — production .env should use:
    # CARDIOSENSE_DATABASE_URL=sqlite:////data/cardiosense.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-tsdb:/prometheus
    ports:
      # Bind to localhost only if you use SSH tunnel — else use "9090:9090" behind firewall
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-in-env}
      GF_USERS_DEFAULT_THEME: dark
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      # Localhost — access via SSH tunnel, or change to "3010:3000" for quick demo (lock down SG)
      - "127.0.0.1:3010:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Set in repo-root .env (see deploy/env.ec2.example). Must be the browser-reachable API URL.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cardiosense-backend-data:
  prometheus-tsdb:
